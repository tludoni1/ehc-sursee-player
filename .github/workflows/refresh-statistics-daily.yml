name: Daily SIHF Player and Goalie Data Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-statistics-daily.yml"
      - "data/mappings.json"
      - "scripts/fetch_players_detail.js"
      - "scripts/fetch_goalies_detail.js"
      - "scripts/discover-current-season.js"
  schedule:
    - cron: "30 22 * * *" # 23:30 MEZ / 00:30 MESZ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sihf-statistics-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install packages
        run: npm install

      - name: Determine season and discover current SIHF team phases
        id: season
        shell: bash
        run: |
          YEAR="$(date -u +%Y)"
          MONTH="$(date -u +%m)"
          if [ "$MONTH" -ge 8 ]; then YEAR="$((YEAR + 1))"; fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          node scripts/discover-current-season.js "$YEAR"
          test "$(jq length "data/mappings_${YEAR}.json")" -eq 4

      - name: Fetch players
        run: node scripts/fetch_players_detail.js --mappings data/mappings_${{ steps.season.outputs.year }}.json

      - name: Fetch goalkeepers
        run: node scripts/fetch_goalies_detail.js --mappings data/mappings_${{ steps.season.outputs.year }}.json

      - name: Commit verified datasets and monthly activity heartbeat
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Monthly Git activity prevents auto-disabling scheduled workflows
          # after 60 days without activity (including the off-season).
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%d > data/.last-monthly-refresh
          fi
          git add data/
          if git diff --cached --quiet; then
            echo "No changed statistics to commit"
            exit 0
          fi
          git commit -m "Refresh SIHF statistics (season ${{ steps.season.outputs.year }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
