name: Discover Sursee 2027 phase IDs and statistics

on:
  pull_request:
    paths:
      - "scripts/discover-sihf-team-phases.js"
      - ".github/workflows/discover-sihf-team-phases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/discover-sihf-team-phases.js
