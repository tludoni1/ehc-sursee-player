name: Diagnose SIHF phase filters 2027

on:
  pull_request:
    paths:
      - "scripts/diagnose-sihf-phases.js"
      - ".github/workflows/diagnose-sihf-phases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/diagnose-sihf-phases.js
